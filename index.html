/* ---------- Citadel line drawing ---------- */
.citadel { color: var(--cit-stroke, var(--navy)); --sw: 1.5; }
.citadel svg { width: 100%; height: auto; overflow: visible; fill: none; stroke: currentColor; stroke-width: var(--sw); stroke-linecap: round; stroke-linejoin: round; }
.citadel .fine { stroke-width: calc(var(--sw) * .55); opacity: .6; }
.citadel .hill { fill: var(--cit-fill, var(--cream)); }
@media (max-width: 640px) { .citadel { --sw: 2.6; } }
@media (prefers-reduced-motion: no-preference) {
  .citadel.animate path { stroke-dasharray: 1 1; animation: draw 1.5s cubic-bezier(.55, .1, .3, 1) both; animation-delay: var(--d, 0ms); }
}
@keyframes draw {
  0% { stroke-dashoffset: 1; opacity: 0; }
  1% { opacity: 1; }
  100% { stroke-dashoffset: 0; opacity: 1; }
}

.kilim-band { position: relative; height: 24px; max-width: 880px; margin: 4px auto 0;

  -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.kilim-band::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 5px; border-top: 1.5px solid var(--sand); border-bottom: 1px solid rgba(217, 160, 122, .55); }

.lead { color: var(--steel-ink); font-size: 1.06rem; }
h3 { color: var(--navy); font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
html[lang="en"] h3 { font-family: var(--f-label); font-weight: 600; font-size: 1.08rem; }

/* ---------- Hero ---------- */
.hero { padding-block: 22px clamp(64px, 9vw, 104px); position: relative; }
.hero::before { content: ""; position: absolute; inset: 0 0 auto; height: 70%; background: radial-gradient(ellipse at 50% 0%, rgba(255, 253, 249, .95), rgba(247, 243, 236, 0) 70%); pointer-events: none; }
.hero > .container { position: relative; }
.hero-art { max-width: 880px; margin-inline: auto; padding-top: 10px; }
.hero-grid { display: grid; gap: 34px; margin-top: 34px; align-items: center; }
.hero-copy { text-align: center; }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-family: var(--f-label); font-weight: 600; font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--steel-ink); }
.eyebrow::before, .eyebrow::after { content: ""; width: 7px; height: 7px; background: var(--sand); transform: rotate(45deg); flex: none; }
html[dir="rtl"] .eyebrow { font-family: var(--f-ar); font-size: .95rem; letter-spacing: 0; text-transform: none; }
h1 { font-family: var(--f-display); font-weight: 600; color: var(--navy); font-size: clamp(2.7rem, 10vw, 5rem); line-height: 1.02; letter-spacing: -.012em; margin: .3em 0 .38em; }
h1 > span { display: block; }
h1 .accent { font-style: italic; font-weight: 500; color: var(--terra); }
html[dir="rtl"] h1 { font-size: clamp(2.15rem, 8vw, 3.8rem); line-height: 1.5; font-weight: 700; }
html[dir="rtl"] h1 .accent { font-style: normal; font-weight: 700; }
.hero-sub { font-size: 1.08rem; color: var(--steel-ink); max-width: 560px; margin-inline: auto; }
.slogan { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; font-weight: 600; color: var(--navy); font-size: .98rem; }
.slogan .ic { color: var(--sand); width: 18px; height: 18px; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 26px; }
.cta-row .btn { flex: 1 1 220px; max-width: 320px; }

.rate-card {
  position: relative; isolation: isolate; overflow: hidden;
  background: var(--navy); color: var(--cream); text-align: center;
  border-radius: 30px; padding: 34px 26px 52px;
  box-shadow: 0 40px 70px -40px rgba(23, 44, 71, .85);
  max-width: 460px; width: 100%; margin-inline: auto;
}
.rate-card::before { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(217, 160, 122, .45); border-radius: 22px; pointer-events: none; }
.rate-card::after { content: ""; position: absolute; inset-inline: 44px; bottom: 24px; height: 14px; background: var(--kilim-row) center / 28px 14px repeat-x; opacity: .85; }
.rate-card .bg-cit { position: absolute; inset-inline: -10%; bottom: 36px; opacity: .1; z-index: -1; --cit-stroke: var(--sand); --cit-fill: transparent; }
.rate-label { display: block; color: var(--sand); font-weight: 700; font-size: 1.05rem; }
.latin-label { display: block; font-family: var(--f-label); font-weight: 600; font-size: .62rem; letter-spacing: .45em; color: rgba(247, 243, 236, .72); margin-top: 4px; padding-inline-start: .45em; }
.rate-main { display: flex; align-items: baseline; justify-content: center; gap: .18em; margin-top: 12px; font-family: var(--f-serif); line-height: 1; font-variant-numeric: lining-nums; }
.rate-usd { font-size: 2.3rem; color: var(--sand); font-weight: 600; }
.rate-eq { font-size: 2rem; opacity: .65; margin-inline: .12em; }
.rate-val { font-size: clamp(4.4rem, 19vw, 6.2rem); font-weight: 600; letter-spacing: -.01em; }
.rate-cur { font-size: 1.05rem; font-weight: 600; margin-top: 2px; letter-spacing: .02em; }
.rate-sub { display: inline-flex; align-items: baseline; gap: .35em; margin-top: 18px; padding: 9px 18px; border-radius: 999px; background: rgba(247, 243, 236, .08); border: 1px solid rgba(247, 243, 236, .18); font-size: .98rem; }
.rate-sub b { font-family: var(--f-serif); font-size: 1.3rem; font-weight: 600; color: var(--sand); font-variant-numeric: lining-nums; }

.stats { list-style: none; padding: 0; margin: 30px 0 0; display: grid; gap: 12px; }
.stat { display: flex; align-items: center; gap: 14px; background: var(--navy-2); color: var(--cream); border-radius: 22px; padding: 16px 18px; box-shadow: 0 20px 34px -28px rgba(23, 44, 71, .9); }
.stat-ic { width: 48px; height: 48px; border-radius: 15px; display: grid; place-items: center; background: rgba(217, 160, 122, .16); color: var(--sand); flex: none; }
.stat-ic .ic { width: 24px; height: 24px; }
.stat strong { display: block; font-size: 1.08rem; font-weight: 700; line-height: 1.35; }
.stat strong .num { font-family: var(--f-serif); font-size: 1.5rem; font-weight: 600; font-variant-numeric: lining-nums; }
.stat-l { display: block; font-size: .87rem; color: rgba(247, 243, 236, .8); line-height: 1.5; }

@media (min-width: 640px) { .stats { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 960px) {
  .hero-grid { grid-template-columns: 1.25fr .9fr; gap: 60px; }
  .hero-copy { text-align: start; }
  .hero-sub { margin-inline: 0; }
  .cta-row { justify-content: flex-start; }
  .cta-row .btn { flex: 0 0 auto; }
  .stats { margin-top: 44px; }
}

/* ---------- Trust strip ---------- */
.trust { background: rgba(255, 253, 249, .78); border-block: 1px solid var(--line); }
.trust-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
.trust-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px 6px; text-align: center; text-decoration: none; }
.trust-item + .trust-item { border-inline-start: 1px solid var(--line); }
a.trust-item:hover .trust-num { color: var(--terra); }
.trust-num { font-family: var(--f-num); font-weight: 600; font-size: clamp(1.9rem, 6.5vw, 3rem); line-height: 1; color: var(--navy); font-variant-numeric: lining-nums; transition: color .2s; }
.trust-num.word { font-family: var(--f-display); font-size: clamp(1.25rem, 4.6vw, 2.2rem); line-height: 1.25; }
.trust-label { font-size: .82rem; color: var(--steel-ink); line-height: 1.45; max-width: 18ch; }
.trust-meta { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-label); font-size: .72rem; color: var(--navy); font-weight: 600; direction: ltr; }
.trust-meta .ic { width: 15px; height: 15px; }
.verified { color: #3B82F6; }
@media (max-width: 420px) { .trust-meta span { display: none; } }

/* ---------- How it works ---------- */
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px; }
.step { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 24px; padding: 26px 22px 24px; box-shadow: var(--shadow); }
.step-top { display: flex; align-items: center; justify-content: space-between; }
.step-ic { width: 54px; height: 54px; border-radius: 17px; background: var(--navy); color: var(--cream); display: grid; place-items: center; }
.step-ic .ic { width: 26px; height: 26px; }
.step-num { font-family: var(--f-serif); font-weight: 600; font-size: 2.8rem; line-height: 1; color: var(--sand); font-variant-numeric: lining-nums; }
.step h3 { margin: 18px 0 6px; }
.step p { color: var(--steel-ink); font-size: .96rem; }
@media (min-width: 720px) { .steps { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1060px) {
  .steps { grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .step:not(:last-child)::after { content: ""; position: absolute; top: 52px; inset-inline-end: -16px; width: 10px; height: 10px; background: var(--sand); transform: rotate(45deg); z-index: 1; }
}
.tip { margin-top: 26px; display: grid; gap: 18px; background: var(--ivory); border: 1.5px dashed rgba(30, 58, 95, .28); border-radius: 26px; padding: 26px 22px; }
.tip-head { display: flex; align-items: center; gap: 14px; }
.tip-ic { width: 52px; height: 52px; border-radius: 50%; background: var(--sand); color: var(--navy-3); display: grid; place-items: center; flex: none; }
.tip ol { margin: 0; padding-inline-start: 1.3em; display: grid; gap: 8px; color: var(--ink); }
.tip ol li::marker { color: var(--terra); font-weight: 700; }
@media (min-width: 900px) {
  .tip { grid-template-columns: minmax(220px, .8fr) 2fr auto; align-items: center; padding: 30px 34px; gap: 30px; }
}

/* ---------- Calculator ---------- */
.calc > * { min-width: 0; }
#usd { width: 100%; }
.calc { display: grid; grid-template-columns: minmax(0, 1fr); background: var(--paper); border: 1px solid var(--line); border-radius: 30px; overflow: hidden; box-shadow: var(--shadow); max-width: 1000px; margin-inline: auto; }
.calc-input { padding: 30px 22px; }
.calc label { display: block; font-weight: 700; color: var(--navy); margin-bottom: 10px; }
.input-wrap { display: flex; align-items: center; direction: ltr; border: 1.5px solid rgba(30, 58, 95, .25); border-radius: 20px; background: #fff; padding-inline: 18px; transition: border-color .2s, box-shadow .2s; }
.input-wrap:focus-within { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(30, 58, 95, .13); }
.input-wrap.invalid { border-color: #B3412E; box-shadow: 0 0 0 4px rgba(179, 65, 46, .12); }
.prefix { font-family: var(--f-serif); font-size: 2.2rem; color: var(--steel); font-weight: 600; }
#usd { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: var(--f-serif); font-size: 2.5rem; font-weight: 600; color: var(--navy); padding: 12px 10px; font-variant-numeric: lining-nums; }
#usd::placeholder { font-family: var(--f-body); font-size: 1rem; font-weight: 400; color: #7C8DA2; }
.calc-err { color: #A93A28; font-size: .9rem; font-weight: 600; margin-top: 8px; }
.chips-label { font-size: .85rem; color: var(--steel-ink); margin: 20px 0 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--ivory); color: var(--navy); font-family: var(--f-serif); font-size: 1.15rem; font-weight: 600; cursor: pointer; transition: all .2s; font-variant-numeric: lining-nums; }
.chips button:hover { border-color: var(--navy); }
.chips button[aria-pressed="true"] { background: var(--navy); color: var(--cream); border-color: var(--navy); }
.calc-rate { display: flex; align-items: center; gap: 10px; margin-top: 22px; padding: 12px 14px; border-radius: 14px; background: rgba(217, 160, 122, .14); color: var(--navy); font-size: .92rem; font-weight: 500; }
.calc-rate .ic { color: var(--terra); }
.calc-result { position: relative; background: var(--navy); color: var(--cream); padding: 30px 22px; display: flex; flex-direction: column; }
.calc-result-label { color: var(--sand); font-weight: 600; }
.calc-big { font-family: var(--f-num); font-size: clamp(2.7rem, 11vw, 4.4rem); font-weight: 600; line-height: 1.05; margin: 8px 0 22px; display: flex; flex-wrap: wrap; align-items: baseline; gap: .25em; font-variant-numeric: lining-nums; }
.calc-big .cur { font-family: var(--f-body); font-size: 1.05rem; font-weight: 600; color: rgba(247, 243, 236, .8); }
.calc-break { margin: 0 0 24px; }
.calc-break div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(247, 243, 236, .14); font-size: .95rem; }
.calc-break dt { color: rgba(247, 243, 236, .78); }
.calc-break dd { margin: 0; font-weight: 600; color: var(--sand); }
.calc-note { font-size: .82rem; color: rgba(247, 243, 236, .72); margin-top: 14px; }
@media (min-width: 900px) {
  .calc { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .calc-input, .calc-result { padding: 46px; }
  .calc-input { display: flex; flex-direction: column; justify-content: center; }
}

/* ---------- Offers ---------- */
.offers-grid { display: grid; gap: 18px; }
.offer { position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 26px; padding: 28px 24px; box-shadow: var(--shadow); }
.offer.featured { background: var(--navy); color: var(--cream); border-color: transparent; }
.offer.featured::after { content: ""; position: absolute; inset: 0; background: var(--kilim-bg); opacity: .7; z-index: -1; -webkit-mask-image: linear-gradient(200deg, #000, transparent 55%); mask-image: linear-gradient(200deg, #000, transparent 55%); }
.offer-tag { align-self: flex-start; font-size: .8rem; font-weight: 700; padding: 6px 14px; border-radius: 999px; background: rgba(217, 160, 122, .2); color: var(--terra); }
.featured .offer-tag { color: var(--sand); }
.offer-big { align-self: flex-start; font-family: var(--f-num); font-size: 3.3rem; font-weight: 600; line-height: 1.1; color: var(--navy); font-variant-numeric: lining-nums; }
.featured .offer-big { color: var(--sand); }
.featured h3 { color: var(--cream); }
.offer p { color: var(--steel-ink); }
.featured p { color: rgba(247, 243, 236, .82); }
.offer-meta { margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line); display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; color: var(--navy); }
.featured .offer-meta { color: var(--cream); border-color: rgba(247, 243, 236, .22); }
.offer-meta .ic { width: 18px; height: 18px; color: var(--sand); }
.offers-cta { text-align: center; margin-top: 30px; }
@media (min-width: 760px) { .offers-grid { grid-template-columns: repeat(2, 1fr); gap: 22px; max-width: 920px; margin-inline: auto; } }

/* ---------- Size guide ---------- */
.size-wrap { max-width: 880px; margin-inline: auto; }
.size-tabs-wrap { text-align: center; margin-bottom: 20px; }
.size-tabs { display: inline-flex; gap: 4px; padding: 5px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; }
.size-tabs [role="tab"] { min-height: 46px; padding: 0 26px; border: 0; border-radius: 999px; background: transparent; color: var(--steel-ink); font-weight: 700; cursor: pointer; transition: all .2s; }
.size-tabs [role="tab"][aria-selected="true"] { background: var(--navy); color: var(--cream); }
.table-wrap { overflow-x: auto; border-radius: 24px; border: 1px solid var(--line); background: var(--paper); box-shadow: var(--shadow); }
.size-table { width: 100%; border-collapse: collapse; font-size: .97rem; }
.size-table th, .size-table td { padding: 14px 8px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
.size-table thead th { background: var(--navy); color: var(--cream); font-weight: 600; font-size: .9rem; }
.size-table thead th small { display: block; font-weight: 400; font-size: .72rem; color: rgba(247, 243, 236, .7); }
.size-table tbody th { font-family: var(--f-label); font-weight: 700; color: var(--navy); letter-spacing: .06em; }
.size-table tbody td { font-variant-numeric: tabular-nums; font-family: var(--f-label); color: var(--ink); font-size: .92rem; }
.size-table tbody tr:nth-child(even) { background: rgba(30, 58, 95, .035); }
.size-table tbody tr:last-child > * { border-bottom: 0; }
.size-how { margin-top: 14px; text-align: center; font-size: .88rem; color: var(--steel-ink); }
.size-note { margin-top: 22px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 22px; border-radius: 22px; background: var(--ivory); border: 1px solid var(--line); border-inline-start: 4px solid var(--sand); }
.size-note p { display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--navy); }
.size-note p .ic { color: var(--terra); }

/* ---------- Feedback ---------- */
.fb-grid { display: grid; gap: 18px; }
.fb-card { position: relative; display: flex; flex-direction: column; gap: 16px; border: 1.5px dashed rgba(30, 58, 95, .3); border-radius: 26px; padding: 28px 24px; background: rgba(255, 253, 249, .7); }
.fb-quote { font-family: var(--f-serif); font-size: 4.2rem; line-height: .6; color: var(--sand); height: 28px; }
.fb-text { font-size: 1.02rem; color: var(--ink); }
.fb-person { display: flex; align-items: center; gap: 12px; margin-top: auto; }
.fb-avatar { width: 46px; height: 46px; border-radius: 50%; background: var(--sand-soft); color: var(--navy); display: grid; place-items: center; }
.fb-name { font-weight: 700; color: var(--navy); display: block; }
.fb-city { font-size: .86rem; color: var(--steel-ink); display: block; }
.fb-badge { position: absolute; top: 18px; inset-inline-end: 18px; font-family: var(--f-label); font-size: .64rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(217, 160, 122, .2); color: var(--terra); }
.fb-cta { text-align: center; margin-top: 30px; }
@media (min-width: 860px) { .fb-grid { grid-template-columns: repeat(3, 1fr); gap: 22px; } }

/* ---------- FAQ ---------- */
.faq-list { max-width: 840px; margin-inline: auto; display: grid; gap: 12px; }
.faq-item { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; transition: border-color .2s, box-shadow .2s; }
.faq-item[open] { border-color: rgba(30, 58, 95, .32); box-shadow: var(--shadow); }
.faq-item summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; min-height: 60px; font-weight: 700; color: var(--navy); border-radius: 20px; }
.faq-item summary::-webkit-details-marker { display: none; }
.faq-ic { position: relative; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); flex: none; transition: background-color .2s; }
.faq-ic::before, .faq-ic::after { content: ""; position: absolute; top: 50%; left: 50%; width: 12px; height: 1.6px; background: var(--navy); transform: translate(-50%, -50%); transition: transform .25s, opacity .25s; }
.faq-ic::after { transform: translate(-50%, -50%) rotate(90deg); }
.faq-item[open] .faq-ic { background: var(--navy); }
.faq-item[open] .faq-ic::before { background: var(--cream); }
.faq-item[open] .faq-ic::after { opacity: 0; transform: translate(-50%, -50%) rotate(0); }
.faq-a { padding: 0 22px 22px; color: var(--steel-ink); }

/* ---------- Contact ---------- */
.contact-grid { display: grid; gap: 18px; }
.map-card {
  position: relative; overflow: hidden; isolation: isolate; min-height: 380px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
  background: var(--navy); color: var(--cream); border-radius: 30px; padding: 28px 24px;
  --cit-stroke: rgba(217, 160, 122, .9); --cit-fill: var(--navy);
  background-image:
    repeating-linear-gradient(0deg, rgba(247, 243, 236, .045) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(247, 243, 236, .045) 0 1px, transparent 1px 34px);
}
.map-card .citadel { position: absolute; inset-inline: 22px; top: 34px; z-index: -1; }
.map-pin { width: 56px; height: 56px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--sand); color: var(--navy-3); display: grid; place-items: center; margin-bottom: 8px; box-shadow: 0 0 0 10px rgba(217, 160, 122, .16); }
.map-pin .ic { transform: rotate(45deg); }
.map-card h3 { color: var(--cream); font-size: 1.35rem; }
.map-card p { color: rgba(247, 243, 236, .82); }
.map-card .btn { align-self: flex-start; margin-top: 8px; }
.map-card iframe { position: absolute; inset: 0 0 auto; width: 100%; height: 250px; border: 0; z-index: 1; background: var(--navy-2); }
.map-card.has-embed { padding-top: 278px; justify-content: flex-start; }
.map-card.has-embed > .citadel { display: none; }
.map-card.has-embed .map-pin { position: absolute; top: 222px; inset-inline-end: 24px; z-index: 2; margin: 0; }
@media (min-width: 900px) {
  .map-card.has-embed { padding-top: 330px; }
  .map-card.has-embed iframe { height: 300px; }
  .map-card.has-embed .map-pin { top: 272px; inset-inline-end: 36px; }
}
.contact-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; align-content: start; }
.contact-item { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 22px; background: var(--paper); border: 1px solid var(--line); text-decoration: none; transition: border-color .2s, transform .2s; }
a.contact-item:hover { border-color: rgba(30, 58, 95, .4); transform: translateY(-2px); }
.ci-ic { width: 50px; height: 50px; border-radius: 16px; background: var(--navy); color: var(--cream); display: grid; place-items: center; flex: none; }
.ci-label { display: block; font-size: .84rem; color: var(--steel-ink); }
.ci-value { display: block; font-weight: 700; color: var(--navy); }
.contact-list .btn { margin-top: 6px; }
@media (min-width: 900px) { .contact-grid { grid-template-columns: 1.25fr 1fr; gap: 22px; } .map-card { min-height: 460px; padding: 36px; } }

/* ---------- Footer ---------- */
.site-footer { background: var(--navy-3); color: rgba(247, 243, 236, .82); position: relative; overflow: hidden; }
.footer-art { max-width: 900px; margin-inline: auto; padding-top: 56px; --cit-stroke: rgba(217, 160, 122, .6); --cit-fill: var(--navy-3); }
.footer-band { max-width: 900px; margin: 4px auto 0; height: 24px; position: relative; opacity: .8; background: var(--kilim-row) center 10px / 28px 14px repeat-x; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.footer-band::before { content: ""; position: absolute; inset-inline: 0; top: 0; height: 5px; border-top: 1.5px solid var(--sand); border-bottom: 1px solid rgba(217, 160, 122, .5); }
.footer-grid { display: grid; gap: 34px; padding-block: 44px; }
.footer-brand { display: flex; align-items: center; gap: 14px; }
.footer-brand img { width: 72px; height: 72px; border-radius: 20px; }
.footer-brand .brand-name { color: var(--cream); font-size: 1.9rem; }

.footer-col a { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; text-decoration: none; color: rgba(247, 243, 236, .86); transition: color .2s; }

/* ---------- Floating WhatsApp (bottom-right LTR / bottom-left RTL) ---------- */
.wa-float {
  position: fixed; z-index: 60;
  bottom: calc(18px + env(safe-area-inset-bottom)); inset-inline-end: 18px;
  width: 60px; height: 60px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--wa); color: #fff;
  box-shadow: 0 14px 30px -10px rgba(18, 140, 74, .7), 0 0 0 4px rgba(247, 243, 236, .9);
  transition: transform .2s;
}
.wa-float:hover { transform: scale(1.06); }
.wa-float .ic { width: 30px; height: 30px; }
@media (prefers-reduced-motion: no-preference) {
  .wa-float::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--wa); animation: ring 2.8s ease-out infinite; }
}
@keyframes ring { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(1.55); opacity: 0; } }

/* ---------- Scroll reveal ---------- */
@media (prefers-reduced-motion: no-preference) {
  .js .reveal { opacity: 0; transform: translateY(24px); transition: opacity .8s ease, transform .8s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--rd, 0ms); }
  .js .reveal.in { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

<script>
(function () {
  'use strict';

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var LANGS = {
    ku: { code: 'ckb', dir: 'rtl', label: 'کوردی', short: 'KU', og: 'ku_IQ' },
    ar: { code: 'ar',  dir: 'rtl', label: 'العربية', short: 'AR', og: 'ar_IQ' },
    en: { code: 'en',  dir: 'ltr', label: 'English', short: 'EN', og: 'en_US' }
  };
  var STORE_KEY = 'qalat-lang';
  var IG_URL = 'https://www.instagram.com/' + CONFIG.instagram + '/';
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var lang = 'ku';

  /* ---------------- Number formatting ---------------- */
  var nf = new Intl.NumberFormat('en-US');
  var usdFmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  function compact(n) {
    if (n >= 1e6) return +(n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return +(n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K';
    return String(n);
  }

  /* ---------------- Text templating ---------------- */
  function fill(str, html, extra) {
    if (str == null) return '';
    if (html === undefined) html = true;
    var L = function (s) { return html ? '<span class="ltr" dir="ltr">' + s + '</span>' : s; };
    var t = {
      rate: nf.format(CONFIG.rate),
      rate100: nf.format(CONFIG.rate * 100),
      rateEq: L('1$ = ' + nf.format(CONFIG.rate)),
      range: L(CONFIG.deliveryMin + '–' + CONFIG.deliveryMax),
      followers: compact(CONFIG.instagramFollowers) + '+',
      views: compact(CONFIG.monthlyViews) + '+',
      ig: '@' + CONFIG.instagram,
      year: new Date().getFullYear()
    };
    if (extra) for (var k in extra) t[k] = extra[k];
    var out = String(str).replace(/\{(\w+)\}/g, function (m, key) { return key in t ? t[key] : m; });
    if (html) {
      out = out
        .replace(/\n/g, '<br>')
        .replace(/\bSHEIN\b/g, '<span class="shein">SHEIN</span>')
        .replace(/\[([^\]]+)\]/g, '<mark class="ph">[$1]</mark>');
    }
    return out;
  }
  function tr(key) { var d = I18N[lang] || I18N.ku; return d[key] != null ? d[key] : (I18N.en[key] || ''); }

  /* ---------------- WhatsApp ---------------- */
  function waUrl(msg) { return 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(msg); }
  function updateWA() {
    $$('[data-wa]').forEach(function (a) {
      var key = 'wa.' + a.getAttribute('data-wa');
      a.href = waUrl(fill(tr(key) || tr('wa.greet'), false));
      a.target = '_blank';
      a.rel = 'noopener';
    });
  }

  /* ---------------- Erbil Citadel line drawing (generated SVG) ---------------- */
  function citadelSVG() {
    var B = 172, P = [];
    var r = function (n) { return Math.round(n * 10) / 10; };
    function add(d, cls, delay) {
      P.push('<path pathLength="1" d="' + d + '"' + (cls ? ' class="' + cls + '"' : '') + ' style="--d:' + Math.round(delay) + 'ms"/>');
    }
    function win(cx, y, w, h, delay) {
      var hw = w / 2;
      add('M' + r(cx - hw) + ' ' + r(y + h) + 'V' + r(y + hw) + 'A' + hw + ' ' + hw + ' 0 0 1 ' + r(cx + hw) + ' ' + r(y + hw) + 'V' + r(y + h) + 'Z', 'fine', delay);
    }
    var T = [
      { x: 96,  w: 28,  t: 118, win: 1 },
      { x: 124, w: 38,  t: 128 },
      { x: 162, w: 30,  t: 106, win: 1 },
      { x: 192, w: 46,  t: 122 },
      { x: 238, w: 44,  t: 90,  win: 2 },
      { x: 282, w: 62,  t: 116, gate: true },
      { x: 344, w: 46,  t: 80,  win: 2 },
      { x: 390, w: 14,  t: 110 },
      { x: 404, w: 112, t: 96,  arches: 6 },
      { x: 516, w: 60,  t: 68,  win: 3 },
      { x: 576, w: 76,  t: 100, arches: 4 },
      { x: 652, w: 46,  t: 84,  win: 2 },
      { x: 698, w: 32,  t: 116 },
      { x: 730, w: 28,  t: 102, win: 1 },
      { x: 758, w: 22,  t: 122 }
    ];
    T.forEach(function (b, i) {
      var dl = 250 + i * 75;
      var n = Math.max(2, Math.round((b.w + 4) / 9)), segs = 2 * n - 1, u = b.w / segs, mh = 4;
      var d = 'M' + b.x + ' ' + B + 'V' + b.t;
      for (var s = 0; s < segs; s++) {
        var nx = r(b.x + (s + 1) * u);
        if (s % 2 === 0) { d += 'H' + nx; if (s < segs - 1) d += 'V' + (b.t + mh); }
        else { d += 'H' + nx + 'V' + b.t; }
      }
      d += 'V' + B;
      add(d, '', dl);
      add('M' + b.x + ' ' + (b.t + 9) + 'H' + (b.x + b.w), 'fine', dl + 260);
      // base hatching
      add('M' + (b.x + 3) + ' ' + (B - 13) + 'H' + (b.x + b.w - 3) + 'M' + (b.x + 5) + ' ' + (B - 18) + 'H' + (b.x + b.w - 5), 'fine', dl + 420);
      if (b.win) {
        var c = b.w >= 56 ? 3 : (b.w >= 40 ? 2 : 1);
        for (var row = 0; row < b.win; row++) {
          for (var k = 0; k < c; k++) win(b.x + b.w * (k + 1) / (c + 1), b.t + 16 + row * 18, 5, 9, dl + 500 + row * 80);
        }
      }
      if (b.arches) {
        for (var a = 0; a < b.arches; a++) win(b.x + b.w * (a + 1) / (b.arches + 1), b.t + 20, 6, 11, dl + 500);
      }
      if (b.gate) {
        var cx = b.x + b.w / 2;
        add('M' + (cx - 13) + ' ' + B + 'V' + (B - 34) + 'H' + (cx + 13) + 'V' + B, '', dl + 300);
        add('M' + (cx - 8) + ' ' + B + 'V' + (B - 20) + 'A8 8 0 0 1 ' + (cx + 8) + ' ' + (B - 20) + 'V' + B, '', dl + 450);
      }
    });
    // hill (filled so it hides the tower bases), ramp, texture, ground
    add('M14 206C46 202 70 186 88 172C94 167 102 166 112 166L768 164C782 164 790 168 798 176C814 192 830 202 848 206Z', 'hill', 0);
    add('M40 206C110 194 200 176 284 165', '', 600);
    add('M78 206C150 195 232 180 300 169', '', 680);
    add('M104 206V200a6 6 0 0 1 12 0v6', 'fine', 900);
    add('M150 190c22-4 44-4 64 0M330 182c30-6 60-4 90 4M470 176c40 4 70 14 100 22M600 180c30 2 60 10 80 18M700 172c20 8 40 20 60 28M410 196c26-3 50-2 72 4', 'fine', 1200);
    add('M6 206H854', '', 0);
    add('M90 212H770', 'fine', 300);
    return '<svg viewBox="0 0 860 216" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">' + P.join('') + '</svg>';
  }
  function renderCitadels() {
    var svg = citadelSVG();
    $$('[data-citadel]').forEach(function (el) { el.innerHTML = svg; });
  }

  /* ---------------- Static config values ---------------- */
  function fillConfig() {
    var v = {
      rate: nf.format(CONFIG.rate),
      rate100: nf.format(CONFIG.rate * 100),
      rateEq: '1$ = ' + nf.format(CONFIG.rate),
      range: CONFIG.deliveryMin + '–' + CONFIG.deliveryMax,
      followers: compact(CONFIG.instagramFollowers) + '+',
      views: compact(CONFIG.monthlyViews) + '+',
      ig: '@' + CONFIG.instagram,
      phone: CONFIG.phoneDisplay
    };
    $$('[data-cfg]').forEach(function (el) { var k = el.getAttribute('data-cfg'); if (k in v) el.textContent = v[k]; });
    $$('[data-ig]').forEach(function (a) { a.href = IG_URL; });
  }

  /* ---------------- Map ---------------- */
  function setupMap() {
    var valid = /^https?:\/\//i.test(CONFIG.mapLink || '');
    var href = valid ? CONFIG.mapLink : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Qalat Shipping');
    $$('#mapLink, .map-link-2').forEach(function (a) { a.href = href; });
    if (/^https:\/\/(www\.)?google\.[a-z.]+\/maps(\/embed|\?.*output=embed)/i.test(CONFIG.mapEmbed || '')) {
      $('#mapCard').classList.add('has-embed');
      var f = document.createElement('iframe');
      f.src = CONFIG.mapEmbed;
      f.loading = 'lazy';
      f.referrerPolicy = 'no-referrer-when-downgrade';
      f.title = 'Google Maps — Qalat Shipping, Erbil';
      f.allowFullscreen = true;
      $('#mapCard').appendChild(f);
    }
  }

  /* ---------------- Size tables ---------------- */
  function renderSizes() {
    ['women', 'men'].forEach(function (g) {
      var tb = $('#tb-' + g);
      if (!tb || !SIZE_CHART[g]) return;
      tb.innerHTML = SIZE_CHART[g].map(function (row) {
        return '<tr><th scope="row">' + row[0] + '</th>' + row.slice(1).map(function (c) {
          return '<td><span dir="ltr">' + c + '</span></td>';
        }).join('') + '</tr>';
      }).join('');
    });
  }
  function setupTabs() {
    var tabs = $$('[role="tab"]');
    function select(tab, focus) {
      tabs.forEach(function (t) {
        var on = t === tab;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        t.tabIndex = on ? 0 : -1;
        document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
      });
      if (focus) tab.focus();
    }
    tabs.forEach(function (t, i) {
      t.addEventListener('click', function () { select(t); });
      t.addEventListener('keydown', function (e) {
        var keys = ['ArrowLeft', 'ArrowRight', 'Home', 'End'];
        if (keys.indexOf(e.key) === -1) return;
        e.preventDefault();
        var rtl = document.documentElement.dir === 'rtl';
        var step = (e.key === 'ArrowRight' ? 1 : -1) * (rtl ? -1 : 1);
        var n = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + step + tabs.length) % tabs.length;
        select(tabs[n], true);
      });
    });
  }

  /* ---------------- Customer reviews (from REVIEWS) ---------------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function renderReviews() {
    var grid = $('#fbGrid');
    var list = (typeof REVIEWS !== 'undefined' && Array.isArray(REVIEWS)) ? REVIEWS.filter(function (r) { return r && r.text; }) : [];
    if (!grid || !list.length) return;
    grid.innerHTML = list.map(function (r) {
      return '<figure class="fb-card" style="margin:0" dir="auto">' +
        '<span class="fb-quote" aria-hidden="true">&ldquo;</span>' +
        '<blockquote class="fb-text" style="margin:0" dir="auto">' + esc(r.text) + '</blockquote>' +
        '<figcaption class="fb-person"><span class="fb-avatar"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg></span>' +
        '<span><span class="fb-name" dir="auto">' + esc(r.name) + '</span>' +
        (r.city ? '<span class="fb-city" dir="auto">' + esc(r.city) + '</span>' : '') + '</span></figcaption></figure>';
    }).join('');
    grid.hidden = false;
  }

  /* ---------------- Price calculator ---------------- */
  var usdIn = $('#usd'), usdWrap = $('#usdWrap'), iqdOut = $('#iqdOut'), usdOut = $('#usdOut'),
      calcErr = $('#calcErr'), calcWa = $('#calcWa');

  function normalizeDigits(s) {
    return s
      .replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); })  // Arabic-Indic ٠-٩
      .replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); }); // Persian/Kurdish ۰-۹
  }
  function parseUSD(raw) {
    var s = normalizeDigits(String(raw || '')).replace(/[\s$]/g, '').replace(/\u066C/g, ',');
    if (!s) return { state: 'empty' };
    s = s.replace(/,(?=\d{3}(?!\d))/g, '');   // thousands separators: 1,250 → 1250
    s = s.replace(/[,\u066B]/g, '.');         // decimal comma / Arabic decimal ٫ → .
    if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) return { state: 'invalid' };
    var v = Number(s);
    if (!isFinite(v) || v > CONFIG.calcMaxUSD) return { state: 'invalid' };
    if (v === 0) return { state: 'empty' };
    return { state: 'ok', value: v };
  }
  function toIQD(usd) {
    var cents = Math.round(usd * 100);              // work in cents to avoid float drift
    var iqd = cents * CONFIG.rate / 100;
    var step = CONFIG.roundTo > 1 ? CONFIG.roundTo : 1;
    return Math.round(iqd / step) * step;
  }
  function updateCalc() {
    var res = parseUSD(usdIn.value);
    var invalid = res.state === 'invalid';
    usdWrap.classList.toggle('invalid', invalid);
    usdIn.setAttribute('aria-invalid', invalid ? 'true' : 'false');
    calcErr.hidden = !invalid;
    calcErr.textContent = invalid ? tr('calc.invalid') : '';
    if (res.state === 'ok') {
      var iqd = toIQD(res.value);
      iqdOut.textContent = nf.format(iqd);
      usdOut.textContent = '$' + usdFmt.format(res.value);
      calcWa.href = waUrl(fill(tr('wa.calc'), false, { usd: usdFmt.format(res.value), iqd: nf.format(iqd) }));
    } else {
      iqdOut.textContent = '0';
      usdOut.textContent = '$0';
      calcWa.href = waUrl(fill(tr('wa.greet'), false));
    }
    $$('.chips button').forEach(function (b) {
      b.setAttribute('aria-pressed', res.state === 'ok' && Number(b.getAttribute('data-amt')) === res.value ? 'true' : 'false');
    });
  }
  function setupCalc() {
    usdIn.addEventListener('input', updateCalc);
    $$('.chips button').forEach(function (b) {
      b.addEventListener('click', function () { usdIn.value = b.getAttribute('data-amt'); updateCalc(); });
    });
  }

  /* ---------------- Language ---------------- */
  function setLang(next, save) {
    if (!I18N[next] || !LANGS[next]) next = 'ku';
    lang = next;
    var meta = LANGS[next], root = document.documentElement;
    root.lang = meta.code;
    root.dir = meta.dir;

    $$('[data-i18n]').forEach(function (el) { el.innerHTML = fill(tr(el.getAttribute('data-i18n'))); });
    $$('[data-i18n-attr]').forEach(function (el) {
      el.getAttribute('data-i18n-attr').split(';').forEach(function (pair) {
        var p = pair.split(':');
        if (p.length === 2) el.setAttribute(p[0].trim(), fill(tr(p[1].trim()), false));
      });
    });

    document.title = fill(tr('meta.title'), false);
    var desc = fill(tr('meta.desc'), false);
    var md = $('meta[name="description"]'); if (md) md.setAttribute('content', desc);
    var ogt = $('meta[property="og:title"]'); if (ogt) ogt.setAttribute('content', document.title);
    var ogd = $('meta[property="og:description"]'); if (ogd) ogd.setAttribute('content', desc);
    var ogl = $('meta[property="og:locale"]'); if (ogl) ogl.setAttribute('content', meta.og);

    $('#langCurrent').textContent = meta.label;
    $('#langShort').textContent = meta.short;
    $$('#langMenu button').forEach(function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-lang') === next ? 'true' : 'false');
    });

    updateWA();
    updateCalc();

    if (save) { try { localStorage.setItem(STORE_KEY, next); } catch (e) { /* storage unavailable */ } }
  }
  function initialLang() {
    var l = null;
    try { l = new URLSearchParams(location.search).get('lang'); } catch (e) {}
    if (!l || !I18N[l]) { try { l = localStorage.getItem(STORE_KEY); } catch (e) { l = null; } }
    return (l && I18N[l]) ? l : CONFIG.defaultLang;
  }

  /* ---------------- Header: language menu, mobile nav, scroll state ---------------- */
  function setupHeader() {
    var langBtn = $('#langBtn'), langMenu = $('#langMenu'), menuBtn = $('#menuBtn'), nav = $('#mainNav'), header = $('#siteHeader');

    function openLang(open) {
      langMenu.hidden = !open;
      langBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) { var cur = langMenu.querySelector('[aria-current="true"]') || langMenu.querySelector('button'); cur.focus(); }
    }
    function openNav(open) {
      nav.classList.toggle('open', open);
      menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    langBtn.addEventListener('click', function (e) { e.stopPropagation(); openNav(false); openLang(langMenu.hidden); });
    $$('#langMenu button').forEach(function (b) {
      b.addEventListener('click', function () { setLang(b.getAttribute('data-lang'), true); openLang(false); langBtn.focus(); });
    });
    langMenu.addEventListener('keydown', function (e) {
      var items = $$('#langMenu button'), i = items.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    });
    menuBtn.addEventListener('click', function (e) { e.stopPropagation(); openLang(false); openNav(!nav.classList.contains('open')); });
    $$('#mainNav a').forEach(function (a) { a.addEventListener('click', function () { openNav(false); }); });
    document.addEventListener('click', function (e) {
      if (!langMenu.hidden && !e.target.closest('.lang')) openLang(false);
      if (nav.classList.contains('open') && !e.target.closest('#mainNav') && !e.target.closest('#menuBtn')) openNav(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!langMenu.hidden) { openLang(false); langBtn.focus(); }
      if (nav.classList.contains('open')) { openNav(false); menuBtn.focus(); }
    });

    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { header.classList.toggle('scrolled', window.scrollY > 8); ticking = false; });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  /* ---------------- Scroll reveal ---------------- */
  function setupReveal() {
    $$('.stagger').forEach(function (g) {
      Array.prototype.forEach.call(g.children, function (c, i) { c.classList.add('reveal'); c.style.setProperty('--rd', (i * 90) + 'ms'); });
    });
    var items = $$('.reveal');
    if (reduceMotion || !('IntersectionObserver' in window)) { items.forEach(function (el) { el.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    items.forEach(function (el) { io.observe(el); });
  }

  /* ---------------- Init ---------------- */
  renderCitadels();
  renderSizes();
  renderReviews();
  fillConfig();
  setupMap();
  setupTabs();
  setupCalc();
  setupHeader();
  setLang(initialLang(), false);
  setupReveal();

  /* exposed for quick testing in the console */
  window.Qalat = { setLang: setLang, toIQD: toIQD, parseUSD: parseUSD };
})();
</script>
</body>
</html>
